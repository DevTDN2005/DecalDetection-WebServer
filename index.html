<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giám sát bao bì thời gian thực</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #232728; color: #c4ddff; font-family: 'Segoe UI', Arial, sans-serif; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 20px; }
    .theme-toggle { padding: 12px 16px; border: 1px solid #3d484f; border-radius: 10px; background: #111; color: #c4ddff; font: 600 14px "Segoe UI", Arial, sans-serif; cursor: pointer; }
    .theme-toggle:focus-visible { outline: 2px solid #ffa337; outline-offset: 3px; }
    .clock { width: fit-content; margin: 0; padding: 10px 16px; border: 1px solid #3d484f; border-radius: 10px; background: #111; text-align: right; }
    .clock-label { font-size: 11px; color: #859da9; }
    #time { margin: 4px 0; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #date { font-size: 13px; color: #a3b5bf; }
    .container { max-width: 860px; margin: 0 auto; text-align: center; }
    h2 { margin: 0 0 32px; font-size: clamp(24px, 4vw, 36px); }
    .dashboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: 0 0 30px; }
    .card { padding: 28px 20px; background: #111; border-radius: 12px; }
    .card h4 { margin: 0 0 12px; font-size: 14px; color: #859da9; text-transform: uppercase; }
    .number { font-size: 40px; font-weight: 700; }
    .error .number { color: #ef4438; }
    .positions-panel { padding: 24px; background: #111; border-radius: 12px; text-align: left; }
    details { border: 1px solid #de820e; border-radius: 6px; overflow: hidden; }
    summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; font-size: 20px; font-weight: 700; background: #21190f; color: #ffa337; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ''; width: 15px; height: 15px; border-right: 3px solid; border-bottom: 3px solid; transform: rotate(45deg); flex-shrink: 0; margin: 0 4px 7px; }
    details[open] summary { border-bottom: 1px solid #de820e; }
    details[open] summary::after { transform: rotate(225deg); margin-bottom: -7px; }
    summary:focus-visible { outline: 3px solid #2878d0; outline-offset: 4px; }
    #position { min-height: 280px; max-height: 400px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
    #position li { padding: 16px 18px; border-bottom: 1px solid #303537; font-size: 18px; overflow-wrap: anywhere; }
    #position li:last-child { border-bottom: 0; }
    #position .empty { color: #a3b5bf; text-align: center; padding-top: 60px; }
    .latest { color: #ffa337; font-weight: 700; }
    #status { margin: 20px 0; color: #a3b5bf; font-size: 14px; }
    @media (max-width: 500px) { body { padding: 16px; } .positions-panel { padding: 16px; border-radius: 12px; } summary { font-size: 21px; } .card { padding: 20px 8px; } }
    body.light { background: #eef2f5; color: #2c3e50; color-scheme: light; }
    body:not(.light) { color-scheme: dark; }
    body.light .clock, body.light .theme-toggle, body.light .card, body.light .positions-panel { background: #fff; }
    body.light .clock, body.light .theme-toggle { border-color: #ccd5dd; }
    body.light .theme-toggle { color: #2c3e50; }
    body.light .clock-label, body.light .card h4 { color: #667783; }
    body.light #date, body.light #status, body.light #position .empty { color: #667783; }
    body.light summary { background: #fff8f0; color: #a85200; }
    body.light #position li { border-bottom-color: #e0e6eb; }
    body.light .latest { color: #a85200; }
    @media (max-width: 380px) { .topbar { gap: 8px; } .theme-toggle { padding: 10px; } .clock { padding: 10px; } }
  </style>
</head>
<body>
  <div class="topbar">
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Bật chế độ sáng">☀ Chế độ sáng</button>
  <aside class="clock" aria-label="Đồng hồ giờ Việt Nam">
    <div class="clock-label">THỜI GIAN HIỆN TẠI · VIỆT NAM</div>
    <div id="time">--:--:--</div>
    <div id="date">--/--/----</div>
  </aside>
  </div>
  <main class="container">
    <h2>GIÁM SÁT SẢN XUẤT BAO BÌ THỜI GIAN THỰC</h2>
    <div class="dashboard">
      <div class="card"><h4>Số lượng</h4><div id="total" class="number">—</div></div>
      <div class="card error"><h4>Số nhãn lỗi</h4><div id="errors" class="number">—</div></div>
    </div>
    <section class="positions-panel" aria-label="Danh sách vị trí lỗi">
      <details open>
        <summary>Vị trí lỗi</summary>
        <ul id="position" aria-live="polite"><li class="empty">Đang tải dữ liệu…</li></ul>
      </details>
    </section>
    <p id="status" role="status">Đang kết nối Firebase…</p>
  </main>
  <script>
    const themeButton = document.getElementById('theme-toggle');
    function applyTheme(isLight) {
      document.body.classList.toggle('light', isLight);
      themeButton.textContent = isLight ? '☾ Chế độ tối' : '☀ Chế độ sáng';
      themeButton.setAttribute('aria-pressed', String(isLight));
      themeButton.setAttribute('aria-label', isLight ? 'Bật chế độ tối' : 'Bật chế độ sáng');
    }
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('production-theme') || 'dark'; } catch (_) {}
    applyTheme(savedTheme === 'light');
    themeButton.addEventListener('click', () => {
      const isLight = !document.body.classList.contains('light');
      applyTheme(isLight);
      try { localStorage.setItem('production-theme', isLight ? 'light' : 'dark'); } catch (_) {}
    });
    const timeFormat = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const dateFormat = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric' });
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = timeFormat.format(now);
      document.getElementById('date').textContent = dateFormat.format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    const firebaseConfig = {
      apiKey: 'AIzaSyB9Uq8HIFo6FjKG0zw2uCYOutq6s1HOK5k',
      authDomain: 'decalwebserver.firebaseapp.com',
      projectId: 'decalwebserver',
      storageBucket: 'decalwebserver.firebasestorage.app',
      messagingSenderId: '331794269229',
      appId: '1:331794269229:web:32f7be72cc879ff4bb64a4',
      measurementId: 'G-WBJY5N4833',
      databaseURL: 'https://decalwebserver-default-rtdb.asia-southeast1.firebasedatabase.app'
    };
    const positionSelect = document.getElementById('position');
    const status = document.getElementById('status');
    let hasData = false;
    let readError = false;
    let connected = false;
    function updateStatus() {
      status.textContent = readError ? 'Không đọc được dữ liệu. Hãy kiểm tra quyền đọc Firebase và kết nối.'
        : !connected ? 'Đang mất kết nối hoặc đang kết nối lại Firebase…'
        : hasData ? 'Dữ liệu được cập nhật theo thời gian thực.' : 'Chưa có dữ liệu ProductionData.';
    }
    function validPosition(value) {
      return (typeof value === 'string' && value.trim() !== '' && value !== 'Chưa có') || typeof value === 'number';
    }
    function renderPositions(data) {
      const items = [];
      // errorPositions có thể chứa giá trị trực tiếp hoặc bản ghi { position, timestamp }.
      const source = data.errorPositions;
      if (source && typeof source === 'object') {
        Object.entries(source).forEach(([key, record]) => {
          const value = record && typeof record === 'object' ? record.position : record;
          if (validPosition(value)) items.push({ key, position: String(value), timestamp: Number(record && typeof record === 'object' ? record.timestamp : 0) || 0 });
        });
      }
      items.sort((a, b) => b.timestamp - a.timestamp || b.key.localeCompare(a.key));
      const latest = data.lastErrorPosition;
      if (validPosition(latest) && !items.some(item => item.position === String(latest))) {
        items.unshift({ key: '__latest', position: String(latest), timestamp: 0 });
      }
      positionSelect.replaceChildren();
      if (!items.length) {
        showPositionMessage('Chưa có vị trí lỗi');
        return;
      }
      items.forEach(item => {
        const row = document.createElement('li');
        const record = data.errorPositions?.[item.key];

        const count = record && typeof record === 'object'
          ? record.errorCount
          : null;

        const imageUrl = record && typeof record === 'object'
          ? record.imageUrl
          : null;

        row.appendChild(document.createTextNode(
          item.position + ' — ' +
          (count != null ? count + ' lỗi' : 'Chưa có số lỗi') +
          ' — '
        ));

        let validImageUrl = null;

        try {
          const url = new URL(imageUrl);
          if (url.protocol === 'https:' || url.protocol === 'http:') {
            validImageUrl = url.href;
          }
        } catch (_) {}

        if (validImageUrl) {
          const link = document.createElement('a');
          link.href = validImageUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Xem hình decal';
          link.style.color = 'inherit';
          row.appendChild(link);
        } else {
          row.appendChild(document.createTextNode('Chưa có ảnh'));
        }

        positionSelect.appendChild(row);
      });
    }
    function showPositionMessage(message) {
      const row = document.createElement('li');
      row.className = 'empty';
      row.textContent = message;
      positionSelect.replaceChildren(row);
    }
    try {
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();
      database.ref('.info/connected').on('value', snapshot => {
        connected = snapshot.val() === true;
        updateStatus();
      });
      database.ref('ProductionData').on('value', snapshot => {
        const data = snapshot.val() || {};
        hasData = snapshot.exists();
        readError = false;
        document.getElementById('total').textContent = data.totalPackages ?? 0;
        document.getElementById('errors').textContent = data.errorLabels ?? 0;
        renderPositions(data);
        updateStatus();
      }, error => {
        readError = true;
        updateStatus();
        showPositionMessage('Không đọc được dữ liệu');
        console.error('Firebase:', error.code);
      });
    } catch (error) {
      status.textContent = 'Không khởi tạo được Firebase. Hãy kiểm tra kết nối và cấu hình.';
      showPositionMessage('Không kết nối được Firebase');
      console.error(error);
    }
  </script>
</body>
</html>
